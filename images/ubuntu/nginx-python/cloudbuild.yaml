options:
  logging: CLOUD_LOGGING_ONLY

# Cloud Build's default build timeout is 10 minutes. install-python.sh compiles
# CPython with PGO + LTO, which does not fit in that even on the 8-vCPU bake VM
# the template asks for, so this is the one flavor that must raise it. 1h is
# generous on purpose: a timeout kills the build mid-bake and leaves the temp
# Packer VM behind, which is a worse failure than a slow build.
timeout: 3600s

substitutions:
  _IMAGE_VERSION: '1-0'

steps:
  - name: 'hashicorp/packer'
    args: ['init', 'images/ubuntu/nginx-python/image.pkr.hcl']

  # versions.env (the installers' single source of truth) is sourced here and the
  # pinned versions passed as -var, because packer's file() can't read it from the
  # template (it lives in a sibling dir, above the template's path.root). Override
  # the image entrypoint to sh so we can source the file before invoking packer.
  # $$VAR escapes a shell var from Cloud Build's own ${...} substitution.
  - name: 'hashicorp/packer'
    entrypoint: 'sh'
    args:
      - -c
      - |
        set -e
        . /workspace/scripts/ubuntu/versions.env
        for cmd in validate build; do
          packer $$cmd \
            -var=image_version=${_IMAGE_VERSION} \
            -var=git_sha=${COMMIT_SHA} \
            -var=nginx_version=$$NGINX_VERSION \
            -var=python_version=$$PYTHON_VERSION \
            images/ubuntu/nginx-python/image.pkr.hcl
        done
