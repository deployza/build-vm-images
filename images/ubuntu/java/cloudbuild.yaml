options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE_VERSION: '1-0-0'

steps:
  - name: 'gcr.io/cloud-builders/git'
    id: debug-source
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "===== Cloud Build source debug ====="
        echo "COMMIT_SHA  = ${COMMIT_SHA}"
        echo "SHORT_SHA   = ${SHORT_SHA}"
        echo "BRANCH_NAME = ${BRANCH_NAME}"
        echo "REPO_NAME   = ${REPO_NAME}"
        echo "PWD         = $(pwd)"
        echo "----- git log (top 3) -----"
        git -C /workspace log --oneline -3 2>/dev/null || echo "(no .git in workspace)"
        echo "----- workspace tree -----"
        ls -la /workspace
        echo "----- this flavor's installers -----"
        ls -la /workspace/scripts/ubuntu
        echo "===================================="

  - name: 'hashicorp/packer'
    args: ['init', 'images/ubuntu/java/image.pkr.hcl']

  - name: 'hashicorp/packer'
    args:
      - validate
      - '-var=image_version=${_IMAGE_VERSION}'
      - '-var=git_sha=${COMMIT_SHA}'
      - 'images/ubuntu/java/image.pkr.hcl'

  - name: 'hashicorp/packer'
    args:
      - build
      - '-var=image_version=${_IMAGE_VERSION}'
      - '-var=git_sha=${COMMIT_SHA}'
      - 'images/ubuntu/java/image.pkr.hcl'
