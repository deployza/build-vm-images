options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE_VERSION: '1-1'

steps:
  - name: 'gcr.io/cloud-builders/git'
    id: debug-source
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "===== Cloud Build source debug ====="
        echo "COMMIT_SHA  = ${COMMIT_SHA}"
        echo "SHORT_SHA   = ${SHORT_SHA}"
        echo "BRANCH_NAME = ${BRANCH_NAME}"
        echo "REPO_NAME   = ${REPO_NAME}"
        echo "PWD         = $(pwd)"
        echo "----- git log (top 3) -----"
        git -C /workspace log --oneline -3 2>/dev/null || echo "(no .git in workspace)"
        echo "----- workspace tree -----"
        ls -la /workspace
        echo "----- this flavor's installers -----"
        ls -la /workspace/scripts/ubuntu
        echo "===================================="

  - name: 'hashicorp/packer'
    args: ['init', 'images/ubuntu/tomcat-mysql/image.pkr.hcl']

  # versions.env (the installers' single source of truth) is sourced here and the
  # pinned versions passed as -var, because packer's file() can't read it from the
  # template (it lives in a sibling dir, above the template's path.root). Override
  # the image entrypoint to sh so we can source the file before invoking packer.
  # $$VAR escapes a shell var from Cloud Build's own ${...} substitution.
  - name: 'hashicorp/packer'
    entrypoint: 'sh'
    args:
      - -c
      - |
        set -e
        . /workspace/scripts/ubuntu/versions.env
        for cmd in validate build; do
          packer $$cmd \
            -var=image_version=${_IMAGE_VERSION} \
            -var=git_sha=${COMMIT_SHA} \
            -var=jdk_version=$$JDK_VERSION \
            -var=tomcat_version=$$TOMCAT_VERSION \
            -var=mysql_version=$$MYSQL_VERSION \
            images/ubuntu/tomcat-mysql/image.pkr.hcl
        done
