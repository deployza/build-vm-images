options:
  logging: CLOUD_LOGGING_ONLY

# install-python.sh compiles CPython with PGO+LTO on every flavor, which does
# not fit Cloud Build's 10-minute default timeout even on the 8-vCPU bake VM
# image.pkr.hcl asks for. 1h is generous on purpose: a timeout kills the build
# mid-bake and leaves the temporary Packer VM behind, which is a worse failure
# than a slow build.
timeout: 3600s

substitutions:
  _IMAGE_VERSION: '1-2'

steps:
  - name: 'hashicorp/packer'
    args: ['init', 'images/ubuntu/nginx/image.pkr.hcl']

  # versions.env (the installers' single source of truth) is sourced here and the
  # pinned version passed as -var, because packer's file() can't read it from the
  # template (it lives in a sibling dir, above the template's path.root). Override
  # the image entrypoint to sh so we can source the file before invoking packer.
  # $$VAR escapes a shell var from Cloud Build's own ${...} substitution.
  - name: 'hashicorp/packer'
    entrypoint: 'sh'
    args:
      - -c
      - |
        set -e
        . /workspace/scripts/ubuntu/versions.env
        for cmd in validate build; do
          packer $$cmd \
            -var=image_version=${_IMAGE_VERSION} \
            -var=git_sha=${COMMIT_SHA} \
            -var=nginx_version=$$NGINX_VERSION \
            -var=mkdocs_version=$$MKDOCS_VERSION \
            images/ubuntu/nginx/image.pkr.hcl
        done
